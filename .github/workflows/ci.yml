name: Website checks
on:
  workflow_call:
    inputs:
      package_release:
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agency
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: agency_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agency -d agency_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025"]
    env:
      DATABASE_URL: postgresql://agency:test_only@127.0.0.1:5432/agency_test
      APP_URL: http://localhost:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      INDEX_SITE: "false"
      PROSPECT_AUTOMATION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate deployment scripts
        run: |
          for file in deploy/*.sh; do bash -n "$file"; done
          shellcheck deploy/*.sh
          python3 -m unittest discover -s tests/deploy -v
      - run: npm ci
      - name: Generate ephemeral test secret
        run: node -e "for (const key of ['BETTER_AUTH_SECRET','PROSPECT_AUTOMATION_TOKEN']) require('fs').appendFileSync(process.env.GITHUB_ENV, key + '=' + require('crypto').randomBytes(48).toString('base64url') + '\n')"
      - run: npm run db:migrate
      - name: Check migration repeatability
        run: npm run db:migrate
      - run: npm run check
      - name: Test production HTTP and database flows
        shell: bash
        run: |
          npm start > /tmp/agency-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --silent --fail http://localhost:3000 > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://localhost:3000 > /dev/null
          node --import tsx tests/integration/owner-inbox.mjs
      - name: Test encrypted backup and isolated database recovery
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          sudo apt-get update
          sudo apt-get install -y restic
          python3 tests/integration/backup-recovery.py
      - name: Package and validate release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: bash deploy/package-release.sh "$RELEASE_SHA" /tmp/agency-release.tar.gz
      - name: Upload tested release
        if: inputs.package_release
        uses: actions/upload-artifact@v4
        with:
          name: agency-release
          path: /tmp/agency-release.tar.gz
          retention-days: 3
          if-no-files-found: error

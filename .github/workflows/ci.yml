name: Website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agency
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: agency_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agency -d agency_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025"]
    env:
      DATABASE_URL: postgresql://agency:test_only@127.0.0.1:5432/agency_test
      APP_URL: http://localhost:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      INDEX_SITE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate ephemeral test secret
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'BETTER_AUTH_SECRET=' + require('crypto').randomBytes(48).toString('base64url') + '\n')"
      - run: npm run db:migrate
      - name: Check migration repeatability
        run: npm run db:migrate
      - run: npm run check
      - name: Test production HTTP and database flows
        shell: bash
        run: |
          npm start > /tmp/agency-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --silent --fail http://localhost:3000 > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://localhost:3000 > /dev/null
          node --import tsx tests/integration/owner-inbox.mjs
